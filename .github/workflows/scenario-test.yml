name: Scenario Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"

jobs:
  scenarios:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable

      - name: Scenario smoke
        shell: pwsh
        run: .\scripts\scenario-smoke.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: markdown/测试/test-reports/
