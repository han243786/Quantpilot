name: Scenario Test

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"

jobs:
  full-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build backend
        run: cargo build --release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install msedge

      - name: Run backend scenarios + frontend E2E
        shell: pwsh
        run: |
          $env:QUANTPILOT_PORT = "3000"
          $env:QUANTPILOT_DEV = "true"
          $env:QUANTPILOT_API_KEY = ""

          # ── Start Backend ──
          Write-Host "[1/5] Starting backend..."
          $backend = Start-Process -FilePath ".\target\release\quantpilot.exe" -PassThru -NoNewWindow

          Write-Host "Waiting for backend..."
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Backend ready"; break }
            } catch { }
            Start-Sleep -Seconds 3
          }

          # ── Start Frontend ──
          Write-Host "[2/5] Starting frontend dev server..."
          $frontend = Start-Process -FilePath "npx" -ArgumentList "vite","--host","127.0.0.1","--port","5173" -WorkingDirectory "frontend" -PassThru -NoNewWindow

          Write-Host "Waiting for frontend..."
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5173" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Frontend ready"; break }
            } catch { }
            Start-Sleep -Seconds 2
          }

          # ── Run Backend Scenarios ──
          Write-Host "[3/5] Running backend scenarios..."
          $failed = 0
          node tools/run-scenario.js tests/scenarios/scenario_01_btc_dual_ma.qs; if ($LASTEXITCODE -ne 0) { $failed++ }
          node tools/run-scenario.js tests/scenarios/scenario_02_backtest_compare.qs; if ($LASTEXITCODE -ne 0) { $failed++ }
          node tools/run-scenario.js tests/scenarios/scenario_08_multi_symbol.qs; if ($LASTEXITCODE -ne 0) { $failed++ }

          # ── Run Frontend E2E ──
          Write-Host "[4/5] Running Playwright E2E tests..."
          Push-Location frontend
          npx playwright test tests/e2e/scenario-test-v2.spec.js --config=playwright.real.config.js
          $e2eExit = $LASTEXITCODE
          Pop-Location

          # ── Cleanup ──
          Write-Host "[5/5] Cleaning up..."
          Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $frontend.Id -Force -ErrorAction SilentlyContinue

          # ── Report ──
          Write-Host ""
          Write-Host "═══════════════════════════════════"
          Write-Host " Backend scenarios: $failed failed"
          Write-Host " Frontend E2E exit: $e2eExit"
          Write-Host "═══════════════════════════════════"
          if ($failed -gt 0 -or $e2eExit -ne 0) { exit 1 }

      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-reports
          path: markdown/测试/test-reports/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: markdown/测试/screenshots/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
