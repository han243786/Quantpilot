name: Scenario Test

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-scenarios:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable

      - name: Build backend
        run: cargo build --release

      - name: Run scenarios
        shell: pwsh
        run: |
          $env:QUANTPILOT_PORT = "3000"
          $env:QUANTPILOT_DEV = "true"
          $env:QUANTPILOT_API_KEY = ""

          Write-Host "Starting backend..."
          $proc = Start-Process -FilePath ".\target\release\quantpilot.exe" -PassThru -WindowStyle Hidden

          Write-Host "Waiting for health..."
          for ($i = 0; $i -lt 30; $i++) {
            try {
              (Invoke-RestMethod "http://127.0.0.1:3000/api/health" -TimeoutSec 3) | Out-Null
              Write-Host "Backend ready (attempt $i)"
              break
            } catch { Start-Sleep -Seconds 3 }
          }

          $failed = 0
          @(
            "tests/scenarios/scenario_01_btc_dual_ma.qs",
            "tests/scenarios/scenario_02_backtest_compare.qs",
            "tests/scenarios/scenario_08_multi_symbol.qs"
          ) | ForEach-Object {
            Write-Host "Running: $_"
            node tools/run-scenario.js $_
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "FAILED" }
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Done: $failed failed"
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-reports
          path: markdown/测试/test-reports/

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & test
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npx playwright install msedge

          Write-Host "Starting frontend dev server..."
          $proc = Start-Process -FilePath ".\node_modules\.bin\vite.cmd" -ArgumentList "--host","127.0.0.1","--port","5173" -PassThru -WindowStyle Hidden

          Write-Host "Waiting for frontend..."
          for ($i = 0; $i -lt 20; $i++) {
            try {
              (Invoke-WebRequest "http://127.0.0.1:5173" -UseBasicParsing -TimeoutSec 3) | Out-Null
              Write-Host "Frontend ready"
              break
            } catch { Start-Sleep -Seconds 2 }
          }

          Write-Host "Running E2E tests..."
          npx playwright test tests/e2e/scenario-test-v2.spec.js --config=playwright.ci.config.js
          $exit = $LASTEXITCODE

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Pop-Location
          exit $exit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
