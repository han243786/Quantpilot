name: package-and-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build package without publishing a GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      APP_NAME: quantpilot
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like "v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $pkg = Get-Content -Raw -Encoding UTF8 Cargo.toml
            $version = [regex]::Match($pkg, '(?m)^\s*version\s*=\s*"([^"]+)"').Groups[1].Value
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        shell: pwsh
        run: cargo build --release

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/quantpilot.exe dist/package/
          Copy-Item frontend/dist dist/package/dist -Recurse
          if (Test-Path config) {
            New-Item -ItemType Directory -Force -Path dist/package/config | Out-Null
            Copy-Item config/* dist/package/config/ -Recurse -ErrorAction SilentlyContinue
          }
          $archive = "dist/$env:APP_NAME-$env:VERSION-x64.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path dist/package/* -DestinationPath $archive
          Get-FileHash $archive -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $archive -Leaf)" } |
            Set-Content -Encoding ASCII dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: dist/*
          retention-days: 7

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/* `
            --title "$env:APP_NAME $env:GITHUB_REF_NAME" `
            --generate-notes
