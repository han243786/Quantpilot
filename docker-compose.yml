version: "3.9"

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - QUANTPILOT_DEV=false
      - QUANTPILOT_API_KEY=${QUANTPILOT_API_KEY:-}
      - QUANTPILOT_RATE_LIMIT_RPS=100
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    restart: unless-stopped

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_ORIGIN=http://backend:3000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    profiles:
      - dev
