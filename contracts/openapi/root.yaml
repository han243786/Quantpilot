components:
  schemas:
    CapabilityResponse:
      type: object
      required: [api_version, schema_version, schema_hash, chain_stages, strategy_ir, runtime, market_data, frontend, versioning, permission_boundary]
      properties:
        api_version:
          type: string
          example: quantpilot-capabilities/v1
        schema_version:
          type: string
        schema_hash:
          type: string
        chain_stages:
          type: array
          items:
            type: string
        strategy_ir:
          type: object
          required: [declared_indicator_kinds, supported_indicator_kinds, indicator_support]
          properties:
            declared_indicator_kinds:
              type: array
              items:
                type: string
            supported_indicator_kinds:
              type: array
              items:
                type: string
            indicator_support:
              type: array
              items:
                type: object
                required: [kind, status]
                properties:
                  kind:
                    type: string
                  status:
                    type: string
                    enum: [supported, declared_only]
                  reason:
                    type: string
                    nullable: true
        runtime:
          type: object
          required: [supported_modes, supported_execution_modules, mode_support, execution_module_support]
          properties:
            supported_modes:
              type: array
              items:
                type: string
            supported_execution_modules:
              type: array
              items:
                type: string
            mode_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
            execution_module_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
        market_data:
          type: object
          required: [supported_exchanges, supported_symbols, exchange_support, symbol_support]
          properties:
            supported_exchanges:
              type: array
              items:
                type: string
            supported_symbols:
              type: array
              items:
                type: string
            exchange_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
            symbol_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
        frontend:
          type: object
          required: [declared_module_keys, supported_module_keys, unsupported_module_reasons, module_support]
          properties:
            declared_module_keys:
              type: array
              items:
                type: string
            supported_module_keys:
              type: array
              items:
                type: string
            unsupported_module_reasons:
              type: object
              additionalProperties:
                type: string
            module_support:
              type: array
              items:
                type: object
                required: [module_key, status]
                properties:
                  module_key:
                    type: string
                  status:
                    type: string
                    enum: [supported, declared_only]
                  reason:
                    type: string
                    nullable: true
        versioning:
          type: object
          required: [model_version, strategy_version_source, parameter_version_policy, deployment_revision_policy]
          properties:
            model_version:
              type: string
            strategy_version_source:
              type: string
            parameter_version_policy:
              type: string
            deployment_revision_policy:
              type: string
        permission_boundary:
          type: object
          required: [model_version, execution_owner_module, live_execution_allowed, ai_write_policy, plugin_network_default, non_execution_order_access]
          properties:
            model_version:
              type: string
            execution_owner_module:
              type: string
            live_execution_allowed:
              type: boolean
            ai_write_policy:
              type: string
              enum: [proposal_only, disabled]
            plugin_network_default:
              type: string
              enum: [deny, allow]
            non_execution_order_access:
              type: string
              enum: [deny, allow]

    NamedCapabilityEntry:
      type: object
      required: [key, status]
      properties:
        key:
          type: string
        status:
          type: string
          enum: [supported, declared_only]
        reason:
          type: string
          nullable: true

    AiProposalRecord:
      type: object
      required: [ai_proposal_id, status, target]
      properties:
        ai_proposal_id:
          type: string
        status:
          type: string
          enum: [draft, submitted, static_check_passed, static_check_failed, denied, expired]
        target:
          type: object

    CreateAiProposalRequest:
      type: object
      required: [source_kind, source_id, target, old_value, new_value, model, prompt_hash, evidence_hash, reason]
      properties:
        source_kind:
          type: string
        source_id:
          type: string
        target:
          type: object
        old_value: {}
        new_value: {}
        model:
          type: object
          required: [provider, model, model_version]
        prompt_hash:
          type: string
        evidence_hash:
          type: string
        reason:
          type: string
          maxLength: 512

    SandboxReport:
      type: object
      required: [proposal_id, sandbox_run_id, baseline_metrics, candidate_metrics, diffs, verdict, replay_fidelity]
      properties:
        proposal_id:
          type: string
        sandbox_run_id:
          type: string
        replay_window:
          type: object
          properties:
            from_ts:
              type: string
            to_ts:
              type: string
        baseline_metrics:
          $ref: '#/components/schemas/SandboxMetrics'
        candidate_metrics:
          $ref: '#/components/schemas/SandboxMetrics'
        diffs:
          type: object
        verdict:
          type: string
          enum: [candidate_outperforms_baseline, candidate_comparable, candidate_underperforms, replay_fidelity_partial]
        warnings:
          type: array
          items:
            type: string
        replay_fidelity:
          type: string

    SandboxMetrics:
      type: object
      properties:
        total_return_ratio:
          type: number
        max_drawdown_ratio:
          type: number
        sharpe_ratio:
          type: number
        win_rate:
          type: number
        avg_hold_hours:
          type: number
        turnover_ratio:
          type: number
        profit_factor:
          type: number
        calmar_ratio:
          type: number

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean

  responses:
    Problem:
      description: RFC 9457 错误响应
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  # ── 凭证管理 ──
  /api/credentials:
    get:
      operationId: listCredentials
      summary: 查询已存储的凭证服务列表
      tags: [system]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: experimental
      responses:
        '200':
          description: 凭证服务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: string
    post:
      operationId: setCredential
      summary: 存储/更新交易所凭证
      tags: [system]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, fields]
              properties:
                service:
                  type: string
                fields:
                  type: object

  /api/credentials/{service}:
    delete:
      operationId: deleteCredential
      summary: 删除指定凭证
      tags: [system]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: experimental
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 凭证已删除

  # ── 测试场景 ──
  /api/test/scenario/run:
    post:
      operationId: runTestScenario
      summary: 运行 QuantScript 测试场景
      tags: [sandbox]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: QuantScript 源码
      responses:
        '200':
          description: 测试报告
