openapi: 3.1.0
info:
  title: QuantPilot Runtime API
  version: 2.3.3
  summary: QuantPilot v2.3.3 HTTP 控制面契约
  description: |
    QuantPilot 策略开发与运行平台的 HTTP API 契约。
    覆盖 capability discovery、runtime session、compile、backtest、AI 提案与审批、
    沙箱验证、告警、快照、runbook、混沌实验、运营报表等全部控制面端点。

    API 版本前缀说明:
      /api/    — v0.1 遗留, 覆盖编译/图管理/运行时/热插拔等核心策略开发循环
      /api/v1/ — 较新系统端点 (告警/快照/审批/混沌/runbook/报表/存储)
    此为有意设计, 见各端点的 x-chain-stage 标注。

servers:
  - url: http://127.0.0.1:3000
    description: 本地开发服务器

tags:
  - name: health
    description: 健康检查
  - name: capabilities
    description: 能力发现
  - name: compile
    description: 编译服务
    x-chain-stage: compile
  - name: graphs
    description: 策略图管理
    x-chain-stage: compile
  - name: hotswap
    description: 受限热插拔
    x-chain-stage: runtime
  - name: runtime
    description: 运行时会话
    x-chain-stage: runtime
  - name: ai-proposals
    description: AI 提案与审批
    x-chain-stage: agent
  - name: sandbox
    description: 沙箱验证
    x-chain-stage: runtime
  - name: alerts
    description: 告警规则引擎
    x-chain-stage: system
  - name: snapshots
    description: 签名快照
    x-chain-stage: system
  - name: runbook
    description: 故障场景手册
    x-chain-stage: system
  - name: chaos
    description: 混沌实验
    x-chain-stage: system
  - name: reports
    description: 运营报表
    x-chain-stage: system

paths:
  # ── 编译 (v0.1 遗留) ──
  /api/runtime/compile:
    post:
      operationId: compileRuntimeConfig
      summary: 编译前端运行时配置
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config, graph_json]
              properties:
                runtime_config:
                  type: object
                  description: 前端运行时配置
                graph_json:
                  type: object
                  description: 策略图 JSON

  /api/strategy-ir/compile:
    post:
      operationId: compileStrategyIr
      summary: 编译 Strategy IR JSON
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_id, compile_id, strategy_ir]
              properties:
                graph_id:
                  type: string
                compile_id:
                  type: string
                strategy_ir:
                  type: object

  /api/quantscript/formal/compile:
    post:
      operationId: compileFormalQuantScript
      summary: 编译正式 QuantScript 源码
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_id, compile_id, source, runtime_template]
              properties:
                graph_id:
                  type: string
                compile_id:
                  type: string
                source:
                  type: string
                runtime_template:
                  type: object
                runtime_targets:
                  type: object

  # ── 运行时回测与会话 (v0.1 遗留) ──
  /api/runtime/backtest:
    post:
      operationId: startBacktest
      summary: 启动回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config]
              properties:
                actor:
                  type: object
                capability_context:
                  type: object
                runtime_config:
                  type: object
                graph_json:
                  type: object
                runtime_targets:
                  type: object
                backtest_options:
                  type: object
                  properties:
                    replay_source:
                      type: string
                    volatility:
                      type: number

  /api/runtime/backtests:
    get:
      operationId: listBacktests
      summary: 查询回测列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/backtests/compare:
    post:
      operationId: compareBacktests
      summary: 对比两个回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backtest_ids]
              properties:
                backtest_ids:
                  type: array
                  items:
                    type: string

  /api/runtime/backtests/{backtest_id}:
    get:
      operationId: getBacktest
      summary: 获取回测详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    delete:
      operationId: discardBacktest
      summary: 丢弃临时回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/backtests/{backtest_id}/save:
    post:
      operationId: saveBacktest
      summary: 持久化回测记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  /api/runtime/backtests/{backtest_id}/replay:
    get:
      operationId: getBacktestReplay
      summary: 获取回测重放事件
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/test-run:
    post:
      operationId: startTestRun
      summary: 启动实时仿真运行
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config]
              properties:
                actor:
                  type: object
                capability_context:
                  type: object
                runtime_config:
                  type: object
                graph_json:
                  type: object
                runtime_targets:
                  type: object
                backtest_options:
                  type: object

  /api/runtime/runs:
    get:
      operationId: listRuns
      summary: 查询运行列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}:
    get:
      operationId: getRun
      summary: 获取运行详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    delete:
      operationId: discardRun
      summary: 丢弃运行记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/save:
    post:
      operationId: saveRun
      summary: 持久化运行记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  /api/runtime/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: SSE 事件流
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/replay:
    get:
      operationId: getRunReplay
      summary: 获取运行重放事件
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/status:
    get:
      operationId: getRunStatus
      summary: 获取运行状态
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  # ── 证据与报告 (v0.1 遗留) ──
  /api/runtime/evidence/health:
    get:
      operationId: getEvidenceHealth
      summary: 证据系统健康检查
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/evidence/cleanup:
    post:
      operationId: cleanupEvidence
      summary: 清理临时证据
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/mutations:
    get:
      operationId: listMutations
      summary: 查询参数变更记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    post:
      operationId: createMutation
      summary: 创建参数变更提案
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}:
    get:
      operationId: getMutation
      summary: 获取变更详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}/activate:
    post:
      operationId: activateMutation
      summary: 激活参数变更
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}/rollback:
    post:
      operationId: rollbackMutation
      summary: 回滚参数变更
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/reports:
    get:
      operationId: listReports
      summary: 查询报告列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta
    post:
      operationId: createReport
      summary: 创建证据报告
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/reports/{report_id}:
    get:
      operationId: getReport
      summary: 获取报告详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/reports/{report_id}/export:
    get:
      operationId: exportReport
      summary: 导出报告产物
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/experiments/backtest-sweep:
    post:
      operationId: startBacktestSweep
      summary: 启动多变量回测实验
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config]
              properties:
                experiment_name:
                  type: string
                actor:
                  type: object
                capability_context:
                  type: object
                runtime_config:
                  type: object
                runtime_targets:
                  type: object
                backtest_options:
                  type: object
                parameter_grid:
                  type: object

  /api/runtime/experiments:
    get:
      operationId: listExperiments
      summary: 查询实验列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/runtime/experiments/{experiment_id}:
    get:
      operationId: getExperiment
      summary: 获取实验详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
    delete:
      operationId: discardExperiment
      summary: 丢弃实验记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/runtime/experiments/{experiment_id}/save:
    post:
      operationId: saveExperiment
      summary: 持久化实验记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  # ── 图管理 (v0.1 遗留) ──
  /api/graphs/save:
    post:
      operationId: saveGraph
      summary: 保存/版本化策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              properties:
                graph:
                  type: object
                version_label:
                  type: string
                save_note:
                  type: string
                actor:
                  type: object

  /api/graphs:
    get:
      operationId: listGraphs
      summary: 查询所有策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/latest:
    get:
      operationId: getLatestGraph
      summary: 加载最近保存的策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}:
    get:
      operationId: getGraph
      summary: 加载指定策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable
    delete:
      operationId: deleteGraph
      summary: 删除策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/audit:
    get:
      operationId: getGraphAudit
      summary: 策略图审计历史
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/versions:
    get:
      operationId: listGraphVersions
      summary: 列出策略图版本
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/versions/{version_id}:
    get:
      operationId: getGraphVersion
      summary: 加载指定版本
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/versions/{version_id}/restore:
    post:
      operationId: restoreGraphVersion
      summary: 恢复到指定版本
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: object

  /api/graphs/{graph_id}/versions/compare/{left}/{right}:
    get:
      operationId: compareGraphVersions
      summary: 对比两个版本
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/reveal:
    post:
      operationId: revealGraph
      summary: 在文件管理器中打开策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}/quantscript:
    get:
      operationId: getGraphQuantScript
      summary: 加载策略图的 QuantScript 表示
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: beta

  /api/quantscript/graph/parse:
    post:
      operationId: parseGraphQuantScript
      summary: 解析 QuantScript 图源码为图 JSON
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: beta

  # ── 热插拔 (v0.1 遗留) ──
  /api/hotswap:
    post:
      operationId: submitHotswap
      summary: 提交热插拔请求
      tags: [hotswap]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/hotswap/list:
    get:
      operationId: listHotswaps
      summary: 查询热插拔记录
      tags: [hotswap]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/hotswap/{hotswap_id}:
    get:
      operationId: getHotswapStatus
      summary: 获取热插拔状态
      tags: [hotswap]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  # ── 健康检查 ──
  /api/health:
    get:
      operationId: healthCheck
      summary: 基础健康检查
      tags: [health]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: stable
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ── 能力发现 ──
  /api/capabilities:
    get:
      operationId: getCapabilities
      summary: 获取运行时能力边界
      tags: [capabilities]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: stable
      responses:
        '200':
          description: 能力契约响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponse'

  # ── AI 提案 ──
  /api/runtime/ai-proposals:
    get:
      operationId: listAiProposals
      summary: 查询 AI 提案列表
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: source_kind
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: AI 提案列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProposalRecord'
    post:
      operationId: createAiProposal
      summary: 创建 AI 提案候选
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiProposalRequest'
      responses:
        '201':
          description: 提案已创建
        '409':
          $ref: '#/components/responses/Problem'

  /api/runtime/ai-proposals/{ai_proposal_id}:
    get:
      operationId: getAiProposal
      summary: 获取 AI 提案详情
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: ai_proposal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 提案详情
        '404':
          $ref: '#/components/responses/Problem'

  # ── 审批流 ──
  /api/v1/ai/approvals:
    get:
      operationId: listApprovals
      summary: 查询审批队列
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: review_state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 审批队列

  /api/v1/ai/approvals/{approval_id}:
    get:
      operationId: getApproval
      summary: 获取审批单详情
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 审批单详情
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/ai/proposals/{proposal_id}/approve:
    post:
      operationId: approveProposal
      summary: 审批通过 AI 提案
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: 审批通过
        '409':
          $ref: '#/components/responses/Problem'

  /api/v1/ai/proposals/{proposal_id}/reject:
    post:
      operationId: rejectProposal
      summary: 审批拒绝 AI 提案
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: 审批拒绝

  /api/v1/ai/proposals/{proposal_id}/claim:
    post:
      operationId: claimProposal
      summary: 审批人认领提案
      tags: [ai-proposals]
      x-owner: backend-runtime
      x-chain-stage: agent
      x-stability: beta
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id:
                  type: string
      responses:
        '200':
          description: 已认领

  # ── 沙箱验证 ──
  /api/v1/ai/proposals/{proposal_id}/sandbox-report:
    get:
      operationId: getSandboxReport
      summary: 获取沙箱验证报告
      tags: [sandbox]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 沙箱验证报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReport'
        '404':
