components:
  schemas:
    ApiErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

    AuthRegisterRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6

    AuthRegisterResponse:
      type: object
      required: [user, message]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        message:
          type: string

    AuthLoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string

    AuthLoginResponse:
      type: object
      required: [token, refresh_token, user]
      properties:
        token:
          type: string
        refresh_token:
          type:
            - string
            - 'null'
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthRefreshRequest:
      type: object
      required: [access_token, refresh_token]
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthRefreshResponse:
      type: object
      required: [token, refresh_token, user]
      properties:
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    V4BacktestArtifact:
      type: object
      required: [schema_version, graph_id, started_at_ms, ended_at_ms, replay_mode, input_bar_count, symbols, machine_trajectory, risk_plane_decisions, execution_capability_sources]
      properties:
        schema_version:
          type: string
          example: quantpilot/v4-backtest-artifact/v1
        graph_id:
          type: string
        started_at_ms:
          type: integer
          format: int64
        ended_at_ms:
          type: integer
          format: int64
        replay_mode:
          type: string
          example: deterministic_bar_replay
        input_bar_count:
          type: integer
        input_tick_count:
          type: integer
          nullable: true
        symbols:
          type: array
          items:
            type: string
        machine_trajectory:
          type: array
          items:
            type: object
        risk_plane_decisions:
          type: array
          items:
            type: object
        execution_capability_sources:
          type: array
          items:
            type: object
        microstructure_metrics:
          type: object
          nullable: true
          properties:
            submitted_order_count:
              type: integer
            filled_order_count:
              type: integer
            fill_rate:
              type: number
            average_slippage_bps:
              type: number
            queue_position_estimate:
              type: number
            vwap_deviation_bps:
              type: number
        final_snapshot:
          $ref: '#/components/schemas/V4RuntimeMemorySnapshot'
          description: v4 runtime memory snapshot captured after replay completion.
    V4RuntimeRunResponse:
      type: object
      required: [run_id, graph_id, event_count, output, diagnostics]
      properties:
        run_id:
          type: string
        graph_id:
          type: string
        event_count:
          type: integer
        output:
          $ref: '#/components/schemas/V4PaperSimulatedRunOutput'
        handoff:
          type: object
          nullable: true
        diagnostics:
          type: array
          items:
            type: object
    V4PaperSimulatedRunOutput:
      type: object
      required: [runtime_mode, events, memory_snapshot, provider_order_submission_attached]
      properties:
        runtime_mode:
          type: string
        events:
          type: array
          items:
            type: object
        memory_snapshot:
          $ref: '#/components/schemas/V4RuntimeMemorySnapshot'
        provider_order_submission_attached:
          type: boolean
    V4RuntimeMemorySnapshot:
      type: object
      required: [graph_id, runtime_mode, ts_ms, machines, risk_plane, execution, simulated_execution, venue_adapter_boundary, event_sequence, provider_order_submission_attached]
      properties:
        graph_id:
          type: string
        runtime_mode:
          type: string
        ts_ms:
          type: integer
          format: int64
        machines:
          type: array
          items:
            $ref: '#/components/schemas/V4MachineRuntimeSnapshot'
        risk_plane:
          type: object
        execution:
          type: object
        simulated_execution:
          type: object
        venue_adapter_boundary:
          type: object
        complexity_metrics:
          $ref: '#/components/schemas/V4ComplexityMetrics'
        event_sequence:
          type: integer
          format: int64
        provider_order_submission_attached:
          type: boolean
    V4MachineRuntimeSnapshot:
      type: object
      required: [machine_id, template, state_id, status]
      properties:
        machine_id:
          type: string
        template:
          type: string
        state_id:
          type: string
        status:
          type: string
        memory:
          type: object
        cached_output:
          type: object
        last_pulled_at_ms:
          type: integer
          format: int64
        last_event_at_ms:
          type: integer
          format: int64
        children:
          type: array
          description: v4.7.0 nested child machine snapshots for the active parent state.
          items:
            $ref: '#/components/schemas/V4MachineRuntimeSnapshot'
    V4ComplexityMetrics:
      type: object
      properties:
        state_count:
          type: integer
        transition_count:
          type: integer
        memory_field_count:
          type: integer
        nested_machine_depth:
          type: integer
        event_processing_path_count:
          type: integer
    CapabilityResponse:
      type: object
      required: [api_version, schema_version, schema_hash, chain_stages, strategy_ir, runtime, market_data, frontend, workspace, ui_actions, versioning, permission_boundary]
      properties:
        api_version:
          type: string
          example: quantpilot-capabilities/v1
        schema_version:
          type: string
        schema_hash:
          type: string
        chain_stages:
          type: array
          items:
            type: string
        strategy_ir:
          type: object
          required: [declared_indicator_kinds, supported_indicator_kinds, indicator_support]
          properties:
            declared_indicator_kinds:
              type: array
              items:
                type: string
            supported_indicator_kinds:
              type: array
              items:
                type: string
            indicator_support:
              type: array
              items:
                type: object
                required: [kind, status]
                properties:
                  kind:
                    type: string
                  status:
                    type: string
                    enum: [supported, declared_only]
                  reason:
                    type: string
                    nullable: true
        runtime:
          type: object
          required: [supported_modes, supported_execution_modules, mode_support, execution_module_support]
          properties:
            supported_modes:
              type: array
              items:
                type: string
            supported_execution_modules:
              type: array
              items:
                type: string
            mode_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
            execution_module_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
        market_data:
          type: object
          required: [supported_exchanges, supported_symbols, exchange_support, symbol_support]
          properties:
            supported_exchanges:
              type: array
              items:
                type: string
            supported_symbols:
              type: array
              items:
                type: string
            exchange_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
            symbol_support:
              type: array
              items:
                $ref: '#/components/schemas/NamedCapabilityEntry'
        frontend:
          type: object
          required: [declared_module_keys, supported_module_keys, unsupported_module_reasons, module_support]
          properties:
            declared_module_keys:
              type: array
              items:
                type: string
            supported_module_keys:
              type: array
              items:
                type: string
            unsupported_module_reasons:
              type: object
              additionalProperties:
                type: string
            module_support:
              type: array
              items:
                type: object
                required: [module_key, status]
                properties:
                  module_key:
                    type: string
                  status:
                    type: string
                    enum: [supported, declared_only]
                  reason:
                    type: string
                    nullable: true
        workspace:
          type: object
          required: [surfaces]
          properties:
            surfaces:
              type: array
              items:
                $ref: '#/components/schemas/UiCapabilityEntry'
        ui_actions:
          type: object
          required: [actions]
          properties:
            actions:
              type: array
              items:
                $ref: '#/components/schemas/UiCapabilityEntry'
        versioning:
          type: object
          required: [model_version, strategy_version_source, parameter_version_policy, deployment_revision_policy]
          properties:
            model_version:
              type: string
            strategy_version_source:
              type: string
            parameter_version_policy:
              type: string
            deployment_revision_policy:
              type: string
        permission_boundary:
          type: object
          required: [model_version, execution_owner_module, live_execution_allowed, ai_write_policy, plugin_network_default, non_execution_order_access]
          properties:
            model_version:
              type: string
            execution_owner_module:
              type: string
            live_execution_allowed:
              type: boolean
            ai_write_policy:
              type: string
              enum: [proposal_only, disabled]
            plugin_network_default:
              type: string
              enum: [deny, allow]
            non_execution_order_access:
              type: string
              enum: [deny, allow]

    NamedCapabilityEntry:
      type: object
      required: [key, status]
      properties:
        key:
          type: string
        status:
          type: string
          enum: [supported, declared_only]
        reason:
          type: string
          nullable: true

    UiCapabilityEntry:
      type: object
      required: [key, status, source]
      properties:
        key:
          type: string
        status:
          type: string
          enum: [supported, declared_only]
        reason:
          type: string
          nullable: true
        source:
          type: string

    AiProposalRecord:
      type: object
      required: [ai_proposal_id, status, target]
      properties:
        ai_proposal_id:
          type: string
        status:
          type: string
          enum: [draft, submitted, static_check_passed, static_check_failed, approved, denied, expired]
        target:
          type: object
        config_domain_binding:
          $ref: '#/components/schemas/AiProposalConfigDomainBinding'

    CreateAiProposalRequest:
      type: object
      required: [source_kind, source_id, target, old_value, new_value, model, prompt_hash, evidence_hash, reason]
      properties:
        source_kind:
          type: string
          enum: [run, backtest]
        source_id:
          type: string
        target:
          type: object
        old_value: {}
        new_value: {}
        model:
          type: object
          required: [provider, model, model_version]
        prompt_hash:
          type: string
        evidence_hash:
          type: string
        reason:
          type: string
          maxLength: 512
        config_domain_binding:
          $ref: '#/components/schemas/AiProposalConfigDomainBinding'

    AiProposalConfigDomainBinding:
      type: object
      required: [target_domain, before_digest, after_digest, evidence_anchor_ids]
      properties:
        target_domain:
          type: string
          enum: [market, observation, state_machine, risk, execution, ai_governance]
        before_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        after_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        evidence_anchor_ids:
          type: array
          items:
            type: string

    SandboxReport:
      type: object
      required: [proposal_id, sandbox_run_id, baseline_metrics, candidate_metrics, diffs, verdict, replay_fidelity]
      properties:
        proposal_id:
          type: string
        sandbox_run_id:
          type: string
        replay_window:
          type: object
          properties:
            from_ts:
              type: string
            to_ts:
              type: string
        baseline_metrics:
          $ref: '#/components/schemas/SandboxMetrics'
        candidate_metrics:
          $ref: '#/components/schemas/SandboxMetrics'
        diffs:
          type: object
        verdict:
          type: string
          enum: [candidate_outperforms_baseline, candidate_comparable, candidate_underperforms, replay_fidelity_partial]
        warnings:
          type: array
          items:
            type: string
        replay_fidelity:
          type: string

    SandboxMetrics:
      type: object
      properties:
        total_return_ratio:
          type: number
        max_drawdown_ratio:
          type: number
        sharpe_ratio:
          type: number
        win_rate:
          type: number
        avg_hold_hours:
          type: number
        turnover_ratio:
          type: number
        profit_factor:
          type: number
        calmar_ratio:
          type: number

    StrategyConfigArtifactRequest:
      type: object
      properties:
        strategy_id:
          type: string
        strategy_version:
          type: string
        source_mode:
          type: string
        graph_json:
          type: object
        runtime_config:
          type: object
        qs_source:
          type: string
        core_ir:
          type: object
        v4_graph:
          type: object
        capability_snapshot_hash:
          type: string
          description: 前端当前使用的 capability schema_hash；后端会与当前 hash 比对 freshness
        capability_source:
          type: string
          description: frontend_snapshot、safe_fallback 或 backend_current
        runtime_mode:
          type: string
          description: 用户侧仅使用 PaperSimulated 或 PaperActual；不得用 live 描述 OKX demo/testnet
        evidence_anchors:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigEvidenceAnchorInput'
        proposal_bindings:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigProposalBindingInput'
        required_execution_capability_sources:
          type: array
          items:
            type: string
            enum: [provider_native, runtime_simulated, unsupported]

    StrategyConfigEvidenceAnchorInput:
      type: object
      required: [anchor_type]
      properties:
        anchor_type:
          type: string
        anchor_id:
          type: string
        digest:
          type: string
        summary:
          type: string

    StrategyConfigProposalBindingInput:
      type: object
      required: [proposal_id, target_domain]
      properties:
        proposal_id:
          type: string
        target_domain:
          $ref: '#/components/schemas/StrategyConfigDomainId'
        before_digest:
          type: string
        after_digest:
          type: string
        evidence_anchor_ids:
          type: array
          items:
            type: string
        sandbox_status:
          type: string
        approval_status:
          type: string

    StrategyConfigArtifact:
      type: object
      required: [schema_version, artifact_id, strategy_id, strategy_version, source, capability, config_domains, runtime_boundary, artifact_digest]
      properties:
        schema_version:
          type: string
        artifact_id:
          type: string
        strategy_id:
          type: string
        strategy_version:
          type: string
        created_at_ms:
          type: integer
          format: int64
        source:
          type: object
        capability:
          $ref: '#/components/schemas/StrategyConfigCapabilitySummary'
        config_domains:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigDomainStatus'
        runtime_boundary:
          $ref: '#/components/schemas/StrategyConfigRuntimeBoundary'
        evidence_anchors:
          type: array
          items:
            type: object
        proposal_bindings:
          type: array
          items:
            type: object
        artifact_digest:
          type: string

    StrategyConfigCapabilitySummary:
      type: object
      required: [capability_snapshot_hash, capability_expected_hash, capability_snapshot_status, capability_source, frontend_module_keys, ui_actions, workspace_surfaces]
      properties:
        capability_snapshot_hash:
          type: string
        capability_expected_hash:
          type: string
        capability_snapshot_status:
          type: string
          enum: [current, stale, safe_fallback]
        capability_source:
          type: string
        frontend_module_keys:
          type: array
          items:
            type: string
        ui_actions:
          type: array
          items:
            type: string
        workspace_surfaces:
          type: array
          items:
            type: string

    StrategyConfigDomainId:
      type: string
      enum: [market, observation, state_machine, risk, execution, evidence, ai_governance, snapshot]

    StrategyConfigDomainStatus:
      type: object
      required: [domain_id, lifecycle, readiness, source_refs, findings]
      properties:
        domain_id:
          $ref: '#/components/schemas/StrategyConfigDomainId'
        lifecycle:
          type: string
          enum: [implemented, documentable, milestone, unsupported]
        readiness:
          type: string
          enum: [ready, incomplete, restricted, stale, blocked]
        source_refs:
          type: array
          items:
            type: object
        findings:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigFinding'
        primary_action:
          type: string

    StrategyConfigRuntimeBoundary:
      type: object
      required: [mode_label, provider_order_submission_attached, provider_order_submission_allowed, live_execution_allowed, execution_capability_sources, rejection_reasons]
      properties:
        mode_label:
          type: string
          enum: [PaperSimulated, PaperActual]
        provider_order_submission_attached:
          type: boolean
        provider_order_submission_allowed:
          type: boolean
        live_execution_allowed:
          type: boolean
          const: false
        execution_capability_sources:
          type: array
          items:
            type: string
        rejection_reasons:
          type: array
          items:
            type: string

    StrategyConfigFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
        code:
          type: string
        message:
          type: string

    StrategyConfigPreflightReport:
      type: object
      required: [schema_version, artifact, decision, can_compile, can_paper_simulated, can_backtest, can_paper_actual_demo, can_live_execution]
      properties:
        schema_version:
          type: string
        artifact:
          $ref: '#/components/schemas/StrategyConfigArtifact'
        decision:
          type: string
          enum: [ready, restricted, blocked]
        can_compile:
          type: boolean
        can_paper_simulated:
          type: boolean
        can_backtest:
          type: boolean
        can_paper_actual_demo:
          type: boolean
        can_live_execution:
          type: boolean
          const: false
        allowed_actions:
          type: array
          items:
            type: string
        blocked_actions:
          type: array
          items:
            type: object
        findings:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigFinding'

    StrategyConfigDiffRequest:
      type: object
      required: [left, right]
      properties:
        left:
          $ref: '#/components/schemas/StrategyConfigArtifact'
        right:
          $ref: '#/components/schemas/StrategyConfigArtifact'

    StrategyConfigDiffReport:
      type: object
      required: [schema_version, left_artifact_id, right_artifact_id, changed]
      properties:
        schema_version:
          type: string
        left_artifact_id:
          type: string
        right_artifact_id:
          type: string
        source_digest_changes:
          type: array
          items:
            type: object
        domain_changes:
          type: array
          items:
            type: object
        runtime_boundary_changed:
          type: boolean
        changed:
          type: boolean

    StrategyConfigEvidenceDiffReport:
      type: object
      required: [schema_version, status, changed, diagnostics]
      properties:
        schema_version:
          type: string
          example: quantpilot/v4-strategy-config-evidence-diff/v1
        left_backtest_id:
          type: string
        right_backtest_id:
          type: string
        status:
          type: string
          enum: [same, different, missing]
        changed:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/StrategyConfigFinding'
        machine_trajectory:
          type: object
        risk_plane:
          type: object
        execution_capability:
          type: object
        metrics:
          type: object

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean

  responses:
    Problem:
      description: RFC 9457 错误响应
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  # ── 测试场景 ──
  /api/test/scenario/run:
    post:
      operationId: runTestScenario
      summary: 运行 QuantScript 测试场景
      tags: [sandbox]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: QuantScript 源码
      responses:
        '200':
          description: 测试报告
