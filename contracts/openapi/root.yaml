openapi: 3.1.0
info:
  title: QuantPilot Runtime API
  version: 4.7.0
  summary: QuantPilot v4.7.0 HTTP 控制面契约
  description: |
    QuantPilot 策略开发与运行平台的 HTTP API 契约。
    覆盖 capability discovery、runtime session、compile、backtest、AI 提案与审批、
    沙箱验证、告警、快照、runbook、混沌实验、运营报表等全部控制面端点。

    API 版本前缀说明:
      /api/    — v0.1 遗留, 覆盖编译/图管理/运行时/热插拔等核心策略开发循环
      /api/v1/ — 较新系统端点 (告警/快照/审批/混沌/runbook/报表/存储)
    此为有意设计, 见各端点的 x-chain-stage 标注。

servers:
  - url: http://127.0.0.1:3000
    description: 本地开发服务器

tags:
  - name: health
    description: 健康检查
  - name: capabilities
    description: 能力发现
  - name: strategy-config
    description: v4 策略配置契约、运行前核验和配置差异
    x-chain-stage: compile
  - name: auth
    description: 用户认证
    x-chain-stage: system
  - name: compile
    description: 编译服务
    x-chain-stage: compile
  - name: graphs
    description: 策略图管理
    x-chain-stage: compile
  - name: hotswap
    description: 受限热插拔
    x-chain-stage: runtime
  - name: runtime
    description: 运行时会话
  - name: executor
    description: 独立执行端控制面
    x-chain-stage: runtime
  - name: ai-proposals
    description: AI 提案与审批
    x-chain-stage: agent
  - name: sandbox
    description: 沙箱验证
    x-chain-stage: runtime
  - name: alerts
    description: 告警规则引擎
    x-chain-stage: system
  - name: snapshots
    description: 签名快照
    x-chain-stage: system
  - name: runbook
    description: 故障场景手册
    x-chain-stage: system
  - name: chaos
    description: 混沌实验
    x-chain-stage: system
  - name: reports
    description: 运营报表
    x-chain-stage: system

paths:
  # ── 编译 (v0.1 遗留) ──
  /api/runtime/compile:
    post:
      operationId: compileRuntimeConfig
      summary: 编译前端运行时配置
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config, graph_json]
              properties:
                runtime_config:
                  type: object
                  description: 前端运行时配置
                graph_json:
                  type: object
                  description: 策略图 JSON

  /api/strategy-ir/compile:
    post:
      operationId: compileStrategyIr
      summary: 编译 Strategy IR JSON
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_id, compile_id, strategy_ir]
              properties:
                graph_id:
                  type: string
                compile_id:
                  type: string
                strategy_ir:
                  type: object

  /api/quantscript/formal/compile:
    post:
      operationId: compileFormalQuantScript
      summary: 编译正式 QuantScript 源码
      tags: [compile]
      x-owner: backend-compile
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_id, compile_id, source, runtime_template]
              properties:
                graph_id:
                  type: string
                compile_id:
                  type: string
                source:
                  type: string
                runtime_template:
                  type: object
                runtime_targets:
                  type: object

  # ── 运行时回测与会话 (v0.1 遗留) ──
  /api/runtime/backtest:
    post:
      operationId: startBacktest
      summary: 启动回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config]
              properties:
                actor:
                  type: object
                capability_context:
                  type: object
                runtime_config:
                  type: object
                graph_json:
                  type: object
                runtime_targets:
                  type: object
                backtest_options:
                  type: object
                  properties:
                    replay_source:
                      type: string
                    runtime_kind:
                      type: string
                      enum: [v3, v4]
                      description: v4 enables deterministic MachineGraph replay and emits backtest_artifacts.v4_artifact
                    symbols:
                      type: array
                      items:
                        type: string
                    volatility:
                      type: number

  /api/runtime/backtests:
    get:
      operationId: listBacktests
      summary: 查询回测列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/backtests/compare:
    post:
      operationId: compareBacktests
      summary: 对比两个回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backtest_ids]
              properties:
                backtest_ids:
                  type: array
                  items:
                    type: string

  /api/runtime/backtests/{backtest_id}:
    get:
      operationId: getBacktest
      summary: 获取回测详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    delete:
      operationId: discardBacktest
      summary: 丢弃临时回测
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/backtests/{backtest_id}/save:
    post:
      operationId: saveBacktest
      summary: 持久化回测记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  /api/runtime/backtests/{backtest_id}/replay:
    get:
      operationId: getBacktestReplay
      summary: 获取回测重放事件
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/v4/run:
    post:
      operationId: startV4RuntimeRun
      summary: 启动 v4 PaperSimulated 状态机运行
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: v4 QuantScript 源码；提供时后端执行静态审计并生成运行时 handoff
                graph:
                  type: object
                  description: 已静态校验过的 v4 runtime graph
                initial_event:
                  type: object
                  description: 可选初始事件；缺省时后端按事件目录生成首个可用事件
      responses:
        '200':
          description: v4 runtime 运行完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V4RuntimeRunResponse'
        '400':
          $ref: '#/components/responses/Problem'

  /api/executor/strategies:
    post:
      operationId: deployExecutorStrategy
      summary: 部署执行端策略，支持 v3 策略包与 v4 graph/QS source
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runtime_kind:
                  type: string
                  enum: [v3, v4]
                runtime_version:
                  type: string
                  enum: [v3, v4]
                graph:
                  type: object
                  description: v4 MachineGraphContract
                source:
                  type: string
                  description: v4 QuantScript 源码
      responses:
        '201':
          description: 策略已部署
        '400':
          $ref: '#/components/responses/Problem'

  /api/executor/health:
    get:
      operationId: getExecutorHealth
      summary: 执行端健康检查
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      responses:
        '200':
          description: 执行端健康状态

  /api/executor/strategies/{strategy_id}:
    get:
      operationId: getExecutorStrategy
      summary: 查询执行端策略详情
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 执行端策略详情

  /api/executor/strategies/{strategy_id}/start:
    post:
      operationId: startExecutorStrategy
      summary: 启动执行端策略 runner，v4 策略必须通过 strategy config preflight
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 策略 runner 已启动
        '423':
          description: strategy config preflight 阻断启动，或 PaperActual demo 边界未满足

  /api/executor/strategies/{strategy_id}/stop:
    post:
      operationId: stopExecutorStrategy
      summary: 停止执行端策略 runner
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 策略 runner 已停止

  /api/executor/strategies/{strategy_id}/klines:
    get:
      operationId: getExecutorStrategyKlines
      summary: 查询执行端策略 K 线缓存
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: interval
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: K 线缓存与最新价格

  /api/executor/params/{strategy_id}:
    post:
      operationId: updateExecutorStrategyParams
      summary: 热更新执行端策略参数
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 参数已提交

  /api/executor/strategies/{strategy_id}/events:
    get:
      operationId: streamExecutorStrategyEvents
      summary: 执行端策略 SSE，v4 策略包含 v4RuntimeMemorySnapshot
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE 事件流

  /api/executor/mode:
    get:
      operationId: getExecutorMode
      summary: 查询执行端双模拟盘模式
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      responses:
        '200':
          description: 当前执行模式
    post:
      operationId: setExecutorMode
      summary: 切换执行端双模拟盘模式
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [paper_simulated, paper_actual]
                  description: paper_actual 固定为 OKX 模拟盘 / 非真实资金
      responses:
        '200':
          description: 模式已切换
        '400':
          $ref: '#/components/responses/Problem'

  /api/executor/provider/okx-demo/orders:
    post:
      operationId: submitOkxDemoProviderOrder
      summary: 提交 OKX 模拟盘 provider 订单
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      description: |
        v4.8.0 PaperActual 唯一 provider 回执路径。请求固定使用 OKX 模拟盘，
        REST header 必须包含 `x-simulated-trading: 1`，production flag=0 不进入该端点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inst_id, side, sz]
              properties:
                strategy_id:
                  type: string
                inst_id:
                  type: string
                  example: BTC-USDT
                side:
                  type: string
                  enum: [buy, sell]
                sz:
                  type: string
                td_mode:
                  type: string
                  enum: [cash]
                  default: cash
                ord_type:
                  type: string
                  enum: [market, limit]
                  default: limit
                px:
                  type: string
                cl_ord_id:
                  type: string
      responses:
        '200':
          description: OKX 模拟盘已返回 provider 回执
        '400':
          $ref: '#/components/responses/Problem'
        '423':
          description: 当前不是 paper_actual 模式
        '502':
          description: OKX 模拟盘 provider 返回错误

  /api/executor/provider/okx-demo/orders/query:
    post:
      operationId: queryOkxDemoProviderOrder
      summary: 查询 OKX 模拟盘 provider 订单回执
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inst_id]
              properties:
                strategy_id:
                  type: string
                inst_id:
                  type: string
                ord_id:
                  type: string
                cl_ord_id:
                  type: string
      responses:
        '200':
          description: OKX 模拟盘订单查询回执
        '423':
          description: 当前不是 paper_actual 模式
        '502':
          description: OKX 模拟盘 provider 返回错误

  /api/executor/provider/okx-demo/orders/cancel:
    post:
      operationId: cancelOkxDemoProviderOrder
      summary: 撤销 OKX 模拟盘 provider 订单
      tags: [executor]
      x-owner: executor
      x-chain-stage: executor
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inst_id]
              properties:
                strategy_id:
                  type: string
                inst_id:
                  type: string
                ord_id:
                  type: string
                cl_ord_id:
                  type: string
      responses:
        '200':
          description: OKX 模拟盘撤单回执
        '423':
          description: 当前不是 paper_actual 模式
        '502':
          description: OKX 模拟盘 provider 返回错误

  /api/runtime/runs:
    get:
      operationId: listRuns
      summary: 查询运行列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}:
    get:
      operationId: getRun
      summary: 获取运行详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    delete:
      operationId: discardRun
      summary: 丢弃运行记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/save:
    post:
      operationId: saveRun
      summary: 持久化运行记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  /api/runtime/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: SSE 事件流
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/replay:
    get:
      operationId: getRunReplay
      summary: 获取运行重放事件
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/runs/{run_id}/status:
    get:
      operationId: getRunStatus
      summary: 获取运行状态
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  # ── 证据与报告 (v0.1 遗留) ──
  /api/runtime/evidence/health:
    get:
      operationId: getEvidenceHealth
      summary: 证据系统健康检查
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/evidence/cleanup:
    post:
      operationId: cleanupEvidence
      summary: 清理临时证据
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/mutations:
    get:
      operationId: listMutations
      summary: 查询参数变更记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable
    post:
      operationId: createMutation
      summary: 创建参数变更提案
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}:
    get:
      operationId: getMutation
      summary: 获取变更详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}/activate:
    post:
      operationId: activateMutation
      summary: 激活参数变更
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/mutations/{proposal_id}/rollback:
    post:
      operationId: rollbackMutation
      summary: 回滚参数变更
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: stable

  /api/runtime/reports:
    get:
      operationId: listReports
      summary: 查询报告列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta
    post:
      operationId: createReport
      summary: 创建证据报告
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/reports/{report_id}:
    get:
      operationId: getReport
      summary: 获取报告详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/reports/{report_id}/export:
    get:
      operationId: exportReport
      summary: 导出报告产物
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: system
      x-stability: beta

  /api/runtime/experiments/backtest-sweep:
    post:
      operationId: startBacktestSweep
      summary: 启动多变量回测实验
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_config]
              properties:
                experiment_name:
                  type: string
                actor:
                  type: object
                capability_context:
                  type: object
                runtime_config:
                  type: object
                runtime_targets:
                  type: object
                backtest_options:
                  type: object
                  properties:
                    replay_source:
                      type: string
                    runtime_kind:
                      type: string
                      enum: [v3, v4]
                    symbols:
                      type: array
                      items:
                        type: string
                parameter_grid:
                  type: object

  /api/runtime/experiments:
    get:
      operationId: listExperiments
      summary: 查询实验列表
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/runtime/experiments/{experiment_id}:
    get:
      operationId: getExperiment
      summary: 获取实验详情
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
    delete:
      operationId: discardExperiment
      summary: 丢弃实验记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta

  /api/runtime/experiments/{experiment_id}/save:
    post:
      operationId: saveExperiment
      summary: 持久化实验记录
      tags: [runtime]
      x-owner: backend-runtime
      x-chain-stage: runtime
      x-stability: beta
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object

  # ── 图管理 (v0.1 遗留) ──
  /api/graphs/save:
    post:
      operationId: saveGraph
      summary: 保存/版本化策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              properties:
                graph:
                  type: object
                version_label:
                  type: string
                save_note:
                  type: string
                actor:
                  type: object

  /api/graphs:
    get:
      operationId: listGraphs
      summary: 查询所有策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/latest:
    get:
      operationId: getLatestGraph
      summary: 加载最近保存的策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable

  /api/graphs/{graph_id}:
    get:
      operationId: getGraph
      summary: 加载指定策略图
      tags: [graphs]
      x-owner: backend-graph
      x-chain-stage: compile
      x-stability: stable
    delete:
      operationId: deleteGraph
