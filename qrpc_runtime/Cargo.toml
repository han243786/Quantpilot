[package]
name = "qrpc-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
qrpc-core = { path = "../qrpc_core" }
qrpc-core-ir = { path = "../qrpc_core_ir" }

[dev-dependencies]
qrpc-compiler = { path = "../qrpc_compiler" }
