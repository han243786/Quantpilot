[workspace]
members = [
    "qrpc_core",
    "qrpc_core_ir",
    "qrpc_compiler",
    "qrpc_runtime",
    "qrpc_session",
    "quantscript",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
sha2 = "0.10"

[package]
name = "quantpilot"
version = "4.7.0"
edition = "2021"

[features]
dev_tools = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
qrpc-core = { path = "qrpc_core" }
qrpc-core-ir = { path = "qrpc_core_ir" }
qrpc-compiler = { path = "qrpc_compiler" }
qrpc-runtime = { path = "qrpc_runtime" }
qrpc-session = { path = "qrpc_session" }
quantscript = { path = "quantscript" }
time = { version = "0.3", features = ["macros", "parsing"] }
ureq = { version = "2", features = ["json", "native-tls", "socks-proxy"] }
hmac = "0.12"
sha2 = { workspace = true }
base64 = "0.22"
chrono = "0.4"
hostname = "0.4"
ring = "0.17"
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# v2.3.4: jwt v10 已知 CVE-2024-46583 (alg混淆)，本项目强制 Algorithm::HS256 不受影响
# v3.7.1: 启用 rust_crypto feature, 防止 JWT 编码在异步运行时中 hang
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
bcrypt = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# v3.0.0: 实时执行端 WebSocket 客户端
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# v3.0.0: 执行端独立 binary
[[bin]]
name = "executor"
path = "src-executor/main.rs"
